apply plugin: 'com.android.application'

android {
    namespace 'com.zgtools.videosaver'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.zgtools.videosaver"
        minSdk 29
        targetSdk 36
        versionCode 63
        versionName "1.11.9"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(System.getenv('VIDEO_SAVER_KEYSTORE') ?: 'release-signing.jks')
            storePassword System.getenv('VIDEO_SAVER_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('VIDEO_SAVER_KEY_ALIAS') ?: 'video_saver_release'
            keyPassword System.getenv('VIDEO_SAVER_KEY_PASSWORD') ?: ''
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
}
