<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>保存助手 · 电脑端工作台</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/logo.svg" alt="logo" />
      <div class="brand-text">
        <div class="brand-title">保存助手</div>
        <div class="brand-sub" id="brandSub">电脑端工作台</div>
      </div>
      <span class="ver-badge" id="verBadge">v1.0.0</span>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot dot-on"></span><span id="statusText">本机在线</span>
    </div>
  </header>

  <!-- 模式切换 -->
  <nav class="mode-tabs">
    <button class="mode-tab active" data-mode="transfer" id="tabTransfer">传输</button>
    <button class="mode-tab" data-mode="download" id="tabDownload">下载</button>
  </nav>

  <!-- 传输页 -->
  <main class="layout" id="pageTransfer">
    <!-- 左列：设备与连接 -->
    <section class="col-left">
      <div class="card">
        <div class="card-title">本机信息</div>
        <div class="kv"><span class="k">设备名称</span><span class="v" id="deviceName">—</span></div>
        <div class="kv"><span class="k">局域网 IP</span><span class="v" id="localIps">—</span></div>
        <div class="kv"><span class="k">监听端口</span><span class="v" id="port">—</span></div>
        <div class="kv block">
          <span class="k">接收目录</span>
          <span class="v path" id="transferDir">—</span>
          <button class="btn-ghost" id="btnChangeDir">更改</button>
        </div>
        <div class="kv block">
          <span class="k">剩余空间</span>
          <div class="space">
            <div class="space-bar"><div class="space-fill" id="spaceFill"></div></div>
            <span class="v small" id="freeSpace">—</span>
          </div>
        </div>
      </div>

      <div class="card grow">
        <div class="card-title">已连接设备</div>
        <div id="deviceList" class="device-list">
          <div class="empty">等待手机端连接…<br /><small>手机端「电脑传输」会在此出现</small></div>
        </div>
      </div>
    </section>

    <!-- 右列：统计 + 队列 + 文件 -->
    <section class="col-right">
      <div class="stats">
        <div class="stat">
          <div class="stat-num" id="statToday">0</div>
          <div class="stat-label">今日接收</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statCount">0</div>
          <div class="stat-label">文件总数</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statSize">0 B</div>
          <div class="stat-label">已接收总量</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">传输队列</div>
        <div id="queue" class="queue">
          <div class="empty small">暂无传输</div>
        </div>
      </div>

      <div class="card grow">
        <div class="card-title">最近文件</div>
        <div id="fileGrid" class="file-grid">
          <div class="empty small">还没有收到文件</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 下载页 -->
  <main class="layout" id="pageDownload" style="display:none">
    <section class="col-left">
      <div class="card">
        <div class="card-title">粘贴链接</div>
        <div class="dl-input-wrap">
          <textarea id="dlUrl" rows="3"
            placeholder="抖音 / 西瓜 / 微信视频号分享链接，或视频直链"></textarea>
          <div class="dl-actions">
            <button class="btn-ghost" id="btnPasteUrl">粘贴</button>
            <button class="btn-primary" id="btnParse">解析</button>
          </div>
        </div>
        <div class="dl-note" id="dlPlatformNote">
          解析后可以勾选要保存的内容，再一次性保存到接收目录。
        </div>
      </div>

      <div class="card">
        <div class="card-title">保存选项</div>
        <label class="opt-row">
          <input type="checkbox" id="optCover" />
          <span>把封面写进视频<span class="opt-hint">快，不重编码</span></span>
        </label>
        <label class="opt-row">
          <input type="checkbox" id="optTitle" />
          <span>把标题烧进视频<span class="opt-hint">需整段重编码，很慢</span></span>
        </label>
        <label class="opt-row">
          <input type="checkbox" id="optSticker" />
          <span>把贴纸合成进图片<span class="opt-hint">平台没给合成图时才需要</span></span>
        </label>
        <label class="opt-row">
          <input type="checkbox" id="optStitch" />
          <span>把选中的图片拼成一个视频</span>
        </label>
        <div class="opt-warn" id="ffmpegWarn" style="display:none"></div>
      </div>

      <div class="card">
        <div class="card-title">视频号登录态</div>
        <div class="dl-note" id="credStatus">读取中…</div>
        <textarea id="credRaw" rows="3"
          placeholder="粘贴浏览器里 yuanbao.tencent.com 的请求（cURL 或 Cookie）"></textarea>
        <div class="dl-actions">
          <button class="btn-ghost" id="btnSaveCred">保存并校验</button>
        </div>
      </div>
    </section>

    <section class="col-right">
      <div class="card grow" id="resultCard" style="display:none">
        <div class="card-title result-head">
          <span class="result-title" id="resultTitle">解析结果</span>
          <span class="result-actions">
            <button class="btn-ghost" id="btnSelAll">全选</button>
            <button class="btn-ghost" id="btnSelNone">全不选</button>
            <button class="btn-primary" id="btnSave">保存选中</button>
          </span>
        </div>
        <div id="itemList" class="item-list"></div>
      </div>

      <div class="card">
        <div class="card-title">保存进度</div>
        <div id="dlQueue" class="queue">
          <div class="empty small">暂无任务</div>
        </div>
      </div>

      <div class="card grow">
        <div class="card-title">接收目录文件</div>
        <div id="dlGrid" class="file-grid">
          <div class="empty small">还没有文件</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="foot-note">仅限同一局域网 · 文件不经过外网</div>
    <div class="foot-actions">
      <button class="btn-ghost" id="btnOpenFolder">打开接收文件夹</button>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
